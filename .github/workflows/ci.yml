name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend tests
        run: python -m pytest -q

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  model-artifact-validation:
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate latest trained model artifact
        run: |
          python - <<'PY'
          import sys, os, torch
          # find latest version directory
          versions_dir = os.path.join(os.path.dirname(__file__), '..', 'models', 'synthetic_speech', 'versions')
          if not os.path.isdir(versions_dir):
              print('No versions directory')
              sys.exit(0)
          versions = [d for d in os.listdir(versions_dir) if d.startswith('rawnet2-v')]
          if not versions:
              print('No model versions found')
              sys.exit(0)
          latest = max(versions, key=lambda d: int(d.split('-v')[1]))
          artifact = os.path.join(versions_dir, latest, 'best.pt')
          if not os.path.exists(artifact):
              print(f'Artifact missing: {artifact}')
              sys.exit(1)
          ckpt = torch.load(artifact, map_location='cpu')
          # basic validation
          if 'model_state_dict' not in ckpt or 'config' not in ckpt:
              print('Invalid checkpoint format')
              sys.exit(1)
          print(f'Validated {latest}')
          sys.exit(0)
        PY